    - Nepal (northern)
    - Bhutan
    - IN-Sikkim
  habitat: "Alpine meadows, grassy slopes, sunny stony flats; often on well-drained gravelly soil in open high-altitude grassland. Characteristic rosette with no stem."
  gbif_taxon_key: 2927053
morphology: |
  Perennial herb; a basal rosette of 2–4 large rotate (nearly circular) leaves lying
  flat on the ground, 7–25 cm wide, deeply veined, with crenate margins. From the
  centre arises a congested spike of whorled lilac to purple flowers at ground
  level. No elongated stem — hence Chinese 独一味 ("single and only"). Rhizome
  short, woody.
parts_used:
  - whole_plant
  - aerial_parts
  - rhizome
