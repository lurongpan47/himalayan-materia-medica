distribution:
  elevation_m: {min: 2800, max: 5600}
  regions:
    - CN-Xizang (Tibet AR)
    - CN-Sichuan (Garzê, Aba)
    - CN-Yunnan (Dêqên)
    - CN-Qinghai (Yushu)
    - Bhutan (northern)
    - Nepal (Mustang, Dolpo)
    - NE India (Sikkim, Arunachal)
  habitat: "Alpine meadows, rocky slopes, screes, cliff crevices; often on calcareous substrate."
  gbif_taxon_key: 8142432
morphology: |
  Perennial herb 10–30 cm, with a thick woody rhizome crowned by persistent old
  leaf bases. Stems several, erect, bearing fleshy obovate to oblong leaves with
  crenate (scalloped) margins (hence the epithet). Inflorescence a dense
  terminal corymb; flowers dioecious, deep red to maroon, 4- to 5-merous.
parts_used:
  - rhizome
  - root
